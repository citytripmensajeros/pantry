<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityPantry — Acceso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(15,81,176,.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0F51B0;
      letter-spacing: -0.5px;
    }
    .logo-sub {
      font-size: .85rem;
      color: #888;
      margin-top: .25rem;
    }
    .form-group {
      margin-bottom: 1.1rem;
    }
    label {
      display: block;
      font-size: .82rem;
      font-weight: 600;
      color: #444;
      margin-bottom: .35rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    input {
      width: 100%;
      padding: .65rem .85rem;
      border: 1.5px solid #dde3f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #0F51B0; }
    .btn {
      width: 100%;
      padding: .75rem;
      background: #0F51B0;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .15s;
    }
    .btn:hover { background: #0a3d87; }
    .error {
      background: #fff0f0;
      border: 1px solid #ffcccc;
      color: #c0392b;
      border-radius: 8px;
      padding: .65rem .85rem;
      font-size: .88rem;
      margin-bottom: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-title">🛒 CityPantry</div>
      <div class="logo-sub">Gestión de compras corporativas</div>
    </div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="usuario" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" required autocomplete="current-password">
      </div>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
