<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CityPantry{% endblock %}</title>
<style>
  :root {
    --azul: #0F51B0;
    --amarillo: #FFDE59;
    --azul-claro: #e8f0fb;
    --gris: #f5f6fa;
    --texto: #1a1a2e;
    --borde: #dde3f0;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gris); color: var(--texto); font-size: 14px; }

  /* NAV */
  nav { background: var(--azul); color: #fff; padding: 0 1.5rem; display: flex; align-items: center; height: 56px; gap: 2rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .nav-brand { font-weight: 700; font-size: 1.1rem; color: var(--amarillo); text-decoration: none; letter-spacing: .5px; }
  .nav-brand span { color: #fff; }
  nav a { color: rgba(255,255,255,.85); text-decoration: none; font-size: .88rem; padding: .4rem .6rem; border-radius: 6px; transition: background .15s; }
  nav a:hover, nav a.active { background: rgba(255,255,255,.15); color: #fff; }
  .nav-spacer { flex: 1; }

  /* LAYOUT */
  .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
  .page-header { margin-bottom: 1.5rem; }
  .page-header h1 { font-size: 1.5rem; font-weight: 700; color: var(--azul); }
  .page-header p { color: #666; margin-top: .25rem; font-size: .9rem; }

  /* CARDS */
  .card { background: #fff; border-radius: 12px; border: 1px solid var(--borde); padding: 1.25rem; }
  .card-title { font-weight: 600; font-size: .95rem; margin-bottom: 1rem; color: var(--azul); }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat-card { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 1.2rem; text-align: center; }
  .stat-num { font-size: 2rem; font-weight: 700; color: var(--azul); }
  .stat-label { font-size: .8rem; color: #666; margin-top: .25rem; }

  /* TABLES */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--azul-claro); color: var(--azul); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .5px; padding: .7rem 1rem; text-align: left; }
  td { padding: .65rem 1rem; border-bottom: 1px solid var(--borde); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gris); }

  /* BADGES */
  .badge { display: inline-block; padding: .2rem .6rem; border-radius: 20px; font-size: .75rem; font-weight: 600; }
  .badge-success { background: #dcfce7; color: var(--success); }
  .badge-warning { background: #fef9c3; color: var(--warning); }
  .badge-danger { background: #fee2e2; color: var(--danger); }
  .badge-info { background: var(--azul-claro); color: var(--azul); }

  /* BUTTONS */
  .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .5rem 1rem; border-radius: 8px; border: none; cursor: pointer; font-size: .85rem; font-weight: 600; text-decoration: none; transition: all .15s; }
  .btn-primary { background: var(--azul); color: #fff; }
  .btn-primary:hover { background: #0d47a0; }
  .btn-secondary { background: #fff; color: var(--azul); border: 1.5px solid var(--azul); }
  .btn-secondary:hover { background: var(--azul-claro); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-sm { padding: .3rem .7rem; font-size: .78rem; }
  .btn-amarillo { background: var(--amarillo); color: var(--texto); }
  .btn-amarillo:hover { background: #f0d000; }

  /* FORMS */
  .form-group { margin-bottom: 1rem; }
  label { display: block; font-size: .82rem; font-weight: 600; color: #555; margin-bottom: .35rem; }
  input, select, textarea { width: 100%; padding: .55rem .75rem; border: 1.5px solid var(--borde); border-radius: 8px; font-size: .9rem; font-family: inherit; transition: border .15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--azul); }
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }

  /* ALERTS */
  .flash { padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: .88rem; font-weight: 500; }
  .flash-success { background: #dcfce7; color: var(--success); border: 1px solid #bbf7d0; }
  .flash-error { background: #fee2e2; color: var(--danger); border: 1px solid #fecaca; }

  /* MODALS */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .modal-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 1.25rem; color: var(--azul); }
  .modal-close { float: right; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #999; }

  /* UTIL */
  .text-right { text-align: right; }
  .text-muted { color: #888; }
  .gap { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .mt1 { margin-top: 1rem; }
  .mb1 { margin-bottom: 1rem; }
  .mono { font-family: monospace; }
  .positive { color: var(--success); }
  .negative { color: var(--danger); }

  @media (max-width: 640px) {
    nav { gap: 0; padding: 0 .75rem; overflow-x: auto; flex-wrap: nowrap; }
    nav a { font-size: .78rem; padding: .35rem .45rem; white-space: nowrap; }
    .nav-brand { font-size: .95rem; margin-right: .5rem; white-space: nowrap; }
    .nav-spacer { display: none; }
    .container { padding: .75rem; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .stat-num { font-size: 1.5rem; }
    .form-row { grid-template-columns: 1fr; }
    .modal { margin: .75rem; width: calc(100% - 1.5rem); }
    .btn { font-size: .82rem; padding: .45rem .8rem; }
    table { font-size: .8rem; }
    th, td { padding: .5rem .6rem; }
    .page-header { flex-direction: column; align-items: flex-start !important; }
    .page-header .gap { flex-wrap: wrap; }
    h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<nav>
  <a class="nav-brand" href="/"><span>City</span>Pantry</a>
  <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Inicio</a>
  <a href="/pedidos" {% if '/pedidos' in request.path %}class="active"{% endif %}>Pedidos</a>
  <a href="/facturas" {% if '/facturas' in request.path %}class="active"{% endif %}>Facturas XML</a>
  <a href="/catalogo" {% if '/catalogo' in request.path %}class="active"{% endif %}>Catálogo</a>
  <a href="/consulta" {% if '/consulta' in request.path %}class="active"{% endif %}>📍 Consulta</a>
  <div class="nav-spacer"></div>
  <a href="/clientes">Clientes</a>
</nav>
<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script>
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
